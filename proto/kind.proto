syntax = "proto3";

package kind;

option go_package = "vortex/client";

service KindService {
  rpc Get(GetRequest) returns (Record);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc RangeScan(RangeScanRequest) returns (RangeScanResponse);
  rpc PrefixScan(PrefixScanRequest) returns (RangeScanResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Cas(CasRequest) returns (CasResponse);
}

message ScanFilter {
  string field = 1;
  string value = 2;
}

message Record {
  string key = 1;
  bytes value = 2;
  optional uint64 expires_at = 3;
}

message GetRequest {
  string key = 1;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  optional uint64 ttl_ms = 3;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message RangeScanRequest {
  string lo = 1;
  string hi = 2;
  repeated ScanFilter filters = 3;
}

message PrefixScanRequest {
  string prefix = 1;
  repeated ScanFilter filters = 2;
}

message RangeScanResponse {
  repeated Record records = 1;
}

message QueryRequest {
  string schema_type = 1;
  string field = 2;
  string value = 3;
  optional uint32 limit = 4;
  optional uint32 offset = 5;
}

message QueryResponse {
  repeated Record records = 1;
}

message CasRequest {
  string key = 1;
  bytes expected_value = 2;
  bytes new_value = 3;
  optional uint64 ttl_ms = 4;
}

message CasResponse {
  bool success = 1;
}
