[package]
name = "kind"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-skiplist = "0.1.3"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3.27.0"
