[package]
name = "kind"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kind"
path = "src/main.rs"

[[bin]]
name = "kindctl"
path = "src/bin/kindctl.rs"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-skiplist = "0.1.3"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "features_bench"
harness = false
