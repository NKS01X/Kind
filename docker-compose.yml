version: '3.8'

services:
  kind-db:
    image: nks01x/kind-db:latest
    container_name: kind-db
    ports:
      - "50051:50051"
    volumes:
      - kind-data:/app/data
    restart: unless-stopped
    # Environment variables are already set in the Dockerfile, 
    # but you can override them here if needed:
    # environment:
    #   - KIND_SNAPSHOT_PATH=/app/data/snapshot.json
    #   - KIND_SCHEMA_PATH=/app/data/schema.ksl
    #   - KIND_WAL_PATH=/app/data/kind.wal

volumes:
  kind-data:
    name: kind-data-volume
